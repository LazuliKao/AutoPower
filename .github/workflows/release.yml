name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Publish NativeAOT
        run: dotnet publish src/AutoPower -c Release -r win-x64 -p:PublishAot=true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPower-win-x64
          path: src/AutoPower/bin/Release/net10.0/win-x64/publish/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src/AutoPower/bin/Release/net10.0/win-x64/publish/*
