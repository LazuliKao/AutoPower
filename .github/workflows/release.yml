name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-x86
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

      - name: Publish NativeAOT
        run: dotnet publish src/AutoPower -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      - name: Get version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rid = "${{ matrix.rid }}"
          $version = "${{ steps.version.outputs.version }}"
          $publishDir = "src/AutoPower/bin/Release/net10.0/$rid/publish"
          $zipName = "AutoPower-$version-$rid.zip"
          Compress-Archive -Path "$publishDir/*" -DestinationPath $zipName
          (Get-FileHash $zipName -Algorithm SHA256).Hash.ToLower() + "  $zipName" | Out-File "$zipName.sha256" -Encoding ascii

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          rid=${{ matrix.rid }}
          version=${{ steps.version.outputs.version }}
          publish_dir=src/AutoPower/bin/Release/net10.0/$rid/publish
          zip_name=AutoPower-$version-$rid.zip
          7z a $zip_name ./$publish_dir/*
          sha256sum $zip_name > $zip_name.sha256

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPower-${{ matrix.rid }}
          path: |
            AutoPower-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip
            AutoPower-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release files
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
