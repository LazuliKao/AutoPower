name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore

      - name: Build (Debug)
        run: dotnet build --no-restore -c Debug

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Debug --verbosity normal

  publish-aot:
    needs: build-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: win-x86
            os: windows-latest
          - rid: win-arm64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Publish NativeAOT
        run: dotnet publish src/AutoPower -c Release -r ${{ matrix.rid }} -p:PublishAot=true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoPower-${{ matrix.rid }}
          path: src/AutoPower/bin/Release/net10.0/${{ matrix.rid }}/publish/*
          retention-days: 7
